<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <title>SIEUMCLUB [LIVE BATTLE] official key visual</title>
  <defs>
    <linearGradient id="kv-word-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5a3c"/>
      <stop offset="18%" stop-color="#ff2f12"/>
      <stop offset="52%" stop-color="#ff8a12"/>
      <stop offset="100%" stop-color="#ffe15a"/>
    </linearGradient>
    <linearGradient id="kv-sub-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6a45"/>
      <stop offset="45%" stop-color="#ff9a1a"/>
      <stop offset="100%" stop-color="#ffe66a"/>
    </linearGradient>
    <linearGradient id="kv-shard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f6fd6"/>
      <stop offset="45%" stop-color="#1f3f9e"/>
      <stop offset="100%" stop-color="#0c1f5c"/>
    </linearGradient>
    <linearGradient id="kv-floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0c1f5c"/>
      <stop offset="50%" stop-color="#1c3f9e"/>
      <stop offset="100%" stop-color="#0c1f5c"/>
    </linearGradient>
    <radialGradient id="kv-star-light" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e4e9f2"/>
      <stop offset="100%" stop-color="#aab3c6"/>
    </radialGradient>
    <linearGradient id="kv-star-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7cee0"/>
      <stop offset="100%" stop-color="#7c88a8"/>
    </linearGradient>
    <clipPath id="kv-rainbow-clip">
      <rect x="200" y="120" width="420" height="220"/>
    </clipPath>
    <filter id="kv-word-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="7" dy="9" stdDeviation="0" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="kv-sub-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- blue faceted shard backdrop -->
  <polygon points="90,330 700,260 960,330 900,430 640,600 130,560 60,430" fill="url(#kv-shard)"/>
  <polygon points="90,330 700,260 720,300 140,375" fill="#5c8bf0" opacity="0.55"/>
  <polygon points="640,600 900,430 930,470 660,590" fill="#0a1740" opacity="0.7"/>
  <line x1="180" y1="560" x2="520" y2="330" stroke="#bcd2ff" stroke-width="4" opacity="0.5"/>
  <line x1="320" y1="580" x2="700" y2="310" stroke="#bcd2ff" stroke-width="3" opacity="0.35"/>
  <line x1="620" y1="595" x2="880" y2="400" stroke="#eaf1ff" stroke-width="5" opacity="0.55"/>

  <!-- ground reflection strip -->
  <polygon points="60,560 940,470 960,510 40,600" fill="url(#kv-floor)" opacity="0.9"/>

  <!-- rainbow arc -->
  <g clip-path="url(#kv-rainbow-clip)">
    <circle cx="410" cy="340" r="185" fill="none" stroke="#e83b2c" stroke-width="20"/>
    <circle cx="410" cy="340" r="163" fill="none" stroke="#ff8a12" stroke-width="20"/>
    <circle cx="410" cy="340" r="141" fill="none" stroke="#ffd233" stroke-width="20"/>
    <circle cx="410" cy="340" r="119" fill="none" stroke="#3fa14a" stroke-width="20"/>
    <circle cx="410" cy="340" r="97" fill="none" stroke="#2e6fd6" stroke-width="20"/>
    <circle cx="410" cy="340" r="78" fill="none" stroke="#12224e" stroke-width="16"/>
  </g>

  <!-- meteor / four-point star -->
  <g transform="translate(660,255) rotate(-8)">
    <polygon points="0,-195 34,-30 190,4 30,34 0,195 -28,32 -185,0 -30,-32" fill="url(#kv-star-light)" stroke="#0a1024" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="0,-195 34,-30 190,4 0,0" fill="url(#kv-star-dark)"/>
    <polygon points="0,195 -28,32 -185,0 0,0" fill="url(#kv-star-dark)"/>
    <polygon points="0,-40 10,-8 42,0 10,8 0,40 -8,8 -40,0 -8,-8" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(500,430) skewX(-11)" filter="url(#kv-word-shadow)">
    <text x="0" y="0" text-anchor="middle"
      font-family="'Arial Black','Pretendard','Segoe UI',sans-serif"
      font-weight="900" font-size="168" letter-spacing="-2"
      fill="url(#kv-word-fill)" stroke="#f4f6ff" stroke-width="9" paint-order="stroke fill"
      stroke-linejoin="round">SIEUMCLUB</text>
  </g>

  <!-- subtitle -->
  <g transform="translate(500,528) skewX(-11)" filter="url(#kv-sub-shadow)">
    <text x="0" y="0" text-anchor="middle"
      font-family="'Arial Black','Pretendard','Segoe UI',sans-serif"
      font-weight="900" font-size="56" letter-spacing="1"
      fill="url(#kv-sub-fill)" stroke="#f4f6ff" stroke-width="5" paint-order="stroke fill"
      stroke-linejoin="round">[LIVE BATTLE]</text>
  </g>
</svg>
